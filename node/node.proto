import "shadow/shadow.proto";

service ShadowService {
  rpc Get(infinimesh.shadow.v1.GetRequest) returns (infinimesh.shadow.v1.GetResponse) {
    option (google.api.http) = {
      get: "/v1/devices/{device}/state"
      additional_bindings {
        get: "/devices/states"
      }
    };
  };
  rpc Patch(infinimesh.shadow.v1.Shadow) returns (infinimesh.shadow.v1.Shadow) {
    option (google.api.http) = {
      post: "/v1/devices/{device}/state"
      body: "*"
      additional_bindings {
        post: "/devices/states"
        body: "*"
      }
    };
  };
  rpc Remove(infinimesh.shadow.v1.RemoveRequest) returns (infinimesh.shadow.v1.Shadow) {
    option (google.api.http) = {
      post: "/v1/devices/{device}/state:remove"
      body: "*"
      additional_bindings {
        post: "/devices/states/remove"
        body: "*"
      }
    };
  };
  rpc StreamShadow(infinimesh.shadow.v1.StreamShadowRequest) returns (stream infinimesh.shadow.v1.Shadow) {
    option (google.api.http) = {
      get: "/v1/devices/states/stream"
      additional_bindings {
        get: "/devices/states/stream"
      }
    };
  }

  rpc StreamShadowSync(infinimesh.shadow.v1.StreamShadowRequest) returns (stream infinimesh.shadow.v1.Shadow);
  rpc PatchMany(infinimesh.shadow.v1.PatchManyRequest) returns (infinimesh.shadow.v1.PatchManyResponse) {
    option (google.api.http) = {
      post: "/v1/devices/states:patchMany"
      body: "*"
      additional_bindings {
        post: "/devices/states:patchMany"
        body: "*"
      }
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Patch desired state on many devices";
      description: "Example body: {\"namespace\":\"plant\",\"tag\":\"line-a\",\"desired\":{\"data\":{\"ota\":{\"version\":\"1.4.0\"}}}}. results has one entry per device. A non-empty error means that device was not updated.";
    };
  };
  // AssignOTA sets desired.data.ota.version. Header x-infinimesh-ota-provider must equal the namespace provider when that provider is hawkbit, mender, or webhook.
  rpc AssignOTA(infinimesh.shadow.v1.AssignOTARequest) returns (infinimesh.shadow.v1.AssignOTAResponse) {
    option (google.api.http) = {
      post: "/v1/devices/ota:assign"
      body: "*"
      additional_bindings {
        post: "/devices/ota:assign"
        body: "*"
      }
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Assign an OTA target version";
      description: "Sets desired.data.ota.version and updated_at. Example body: {\"namespace\":\"plant\",\"version\":\"1.4.0\"}. A tag: {\"namespace\":\"plant\",\"tag\":\"line-a\",\"version\":\"1.4.0\"}. A device list: {\"devices\":[\"dev-1\",\"dev-2\"],\"version\":\"1.4.0\"}. results has one entry per device. Header x-infinimesh-ota-provider must match Namespace.ota.provider when that provider is hawkbit, mender, or webhook. Each success is an audit row with action ota_assign.";
      parameters: {
        headers: {
          name: "x-infinimesh-ota-provider";
          description: "Must equal the namespace OTA provider when that provider is hawkbit, mender, or webhook. Omit it when the provider is none.";
          type: STRING;
        }
      }
    };
  };
}

