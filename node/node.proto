syntax = "proto3";
package infinimesh.node.v1;
option go_package = "github.com/infinimesh/proto/node;node";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Infinimesh API";
    version: "1.0.0";
  };
};
import "node/accounts/accounts.proto";
import "node/access/access.proto";
import "node/sessions/sessions.proto";
import "node/rules/rules.proto";
import "node/audit/audit.proto";
import "node/grants/grants.proto";

message TokenRequest {
  infinimesh.node.accounts.v1.Credentials auth = 1;
  int64 exp = 2 [deprecated = true];
  optional string uuid = 3;
  optional bool inf = 4 [deprecated = true];
  optional string client = 5;
  int64 expires_at = 6;
  optional bool infinite = 7;
}

message TokenResponse {
  string token = 1;
}

message SetCredentialsRequest {
  string uuid = 1;
  infinimesh.node.accounts.v1.Credentials credentials = 2;
}

message GetCredentialsRequest {
  string uuid = 1;
}

message GetCredentialsResponse {
  repeated infinimesh.node.accounts.v1.Credentials credentials = 1;
}

message DeleteCredentialsRequest {
  string uuid = 1;
  string type = 2;
}

message SetCredentialsResponse {}
message DeleteResponse {}
message EmptyMessage {}

message ListRequest {
  int32 page_size = 1;
  string page_token = 2;
}

service AccountsService {
  rpc Token(TokenRequest) returns (TokenResponse) {
    option (google.api.http) = {
      post: "/v1/token"
      body: "*"
      additional_bindings {
        post: "/token"
        body: "*"
      }
    };
  };

  rpc Get(infinimesh.node.accounts.v1.Account) returns (infinimesh.node.accounts.v1.Account) {
    option (google.api.http) = {
      get: "/v1/accounts/{uuid}"
      additional_bindings {
        get: "/accounts/{uuid}"
      }
    };
  };
  rpc List(ListRequest) returns (infinimesh.node.accounts.v1.Accounts) {
    option (google.api.http) = {
      get: "/v1/accounts"
      additional_bindings {
        get: "/accounts"
      }
    };
  };

  rpc Create(infinimesh.node.accounts.v1.CreateRequest) returns (infinimesh.node.accounts.v1.CreateResponse) {
    option (google.api.http) = {
      post: "/v1/accounts"
      body: "*"
      additional_bindings {
        put: "/accounts"
        body: "*"
      }
    };
  };
  rpc Update(infinimesh.node.accounts.v1.Account) returns (infinimesh.node.accounts.v1.Account) {
    option (google.api.http) = {
      patch: "/v1/accounts/{uuid}"
      body: "*"
      additional_bindings {
        patch: "/accounts/{uuid}"
        body: "*"
      }
    };
  };
  rpc Toggle(infinimesh.node.accounts.v1.Account) returns (infinimesh.node.accounts.v1.Account) {
    option (google.api.http) = {
      post: "/v1/accounts/{uuid}/toggle"
      body: "*"
      additional_bindings {
        post: "/accounts/{uuid}/toggle"
        body: "*"
      }
    };
  };  

  rpc Delete(infinimesh.node.accounts.v1.Account) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/accounts/{uuid}"
      additional_bindings {
        delete: "/accounts/{uuid}"
      }
    };
  };
  rpc Deletables(infinimesh.node.accounts.v1.Account) returns (infinimesh.node.access.v1.Nodes) {
    option (google.api.http) = {
      get: "/v1/accounts/{uuid}/deletables"
      additional_bindings {
        get: "/accounts/{uuid}/deletables"
      }
    };
  };

  rpc SetCredentials(SetCredentialsRequest) returns (SetCredentialsResponse) {
    option (google.api.http) = {
      post: "/v1/accounts/{uuid}/credentials"
      body: "*"
      additional_bindings {
        post: "/accounts/{uuid}/credentials"
        body: "*"
      }
    };
  };

  rpc GetCredentials(GetCredentialsRequest) returns (GetCredentialsResponse) {
    option (google.api.http) = {
      get: "/v1/accounts/{uuid}/credentials"
      additional_bindings {
        get: "/accounts/{uuid}/credentials"
      }
    };
  };

  rpc DeleteCredentials(DeleteCredentialsRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/accounts/{uuid}/credentials/{type}"
      additional_bindings {
        delete: "/accounts/{uuid}/credentials/{type}"
      }
    };
  };
}

import "node/namespaces/namespaces.proto";

message JoinRequest {
  string namespace = 1;
  string account = 2;
  infinimesh.node.access.v1.Level access = 3;
}

service NamespacesService {
  rpc Get(infinimesh.node.namespaces.v1.Namespace) returns (infinimesh.node.namespaces.v1.Namespace) {
    option (google.api.http) = {
      get: "/v1/namespaces/{uuid}"
      additional_bindings {
        get: "/namespaces/{uuid}"
      }
    };
  };
  rpc List(ListRequest) returns (infinimesh.node.namespaces.v1.Namespaces) {
    option (google.api.http) = {
      get: "/v1/namespaces"
      additional_bindings {
        get: "/namespaces"
      }
    };
  };

  rpc Create(infinimesh.node.namespaces.v1.Namespace) returns (infinimesh.node.namespaces.v1.Namespace) {
    option (google.api.http) = {
      post: "/v1/namespaces"
      body: "*"
      additional_bindings {
        put: "/namespaces"
        body: "*"
      }
    };
  };
  rpc Update(infinimesh.node.namespaces.v1.Namespace) returns (infinimesh.node.namespaces.v1.Namespace) {
    option (google.api.http) = {
      patch: "/v1/namespaces/{uuid}"
      body: "*"
      additional_bindings {
        patch: "/namespaces/{uuid}"
        body: "*"
      }
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update a namespace, including its OTA provider";
      description: "Example body: {\"uuid\":\"ns-1\",\"ota\":{\"enabled\":true,\"provider\":\"webhook\",\"webhookUrl\":\"https://ota.example/hook\"}}. provider is none, hawkbit, mender, or webhook. enabled can be true only when a plugin of kind OTA is registered. addonRegistered is ignored on write.";
    };
  };
  rpc Delete(infinimesh.node.namespaces.v1.Namespace) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/namespaces/{uuid}"
      additional_bindings {
        delete: "/namespaces/{uuid}"
      }
    };
  };
  rpc Deletables(infinimesh.node.namespaces.v1.Namespace) returns (infinimesh.node.access.v1.Nodes) {
    option (google.api.http) = {
      get: "/v1/namespaces/{uuid}/deletables"
      additional_bindings {
        get: "/namespaces/{uuid}/deletables"
      }
    };
  };

  // Accounts having access to this namespace
  rpc Joins(infinimesh.node.namespaces.v1.Namespace) returns (infinimesh.node.accounts.v1.Accounts) {
    option (google.api.http) = {
      get: "/v1/namespaces/{uuid}/joins"
      additional_bindings {
        get: "/namespaces/{uuid}/joins"
      }
    };
  }
  // Sets Access to this namespace for the given account(deletes if level is set to NONE(0))
  rpc Join(JoinRequest) returns (infinimesh.node.accounts.v1.Accounts) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/join"
      body: "*"
      additional_bindings {
        post: "/namespaces/{namespace}/join"
        body: "*"
      }
    };
  }
}

import "node/devices/devices.proto";

message DevicesTokenRequest {
