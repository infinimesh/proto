  string token = 2;
}

message MoveRequest {
  string uuid = 1;
  string namespace = 2;
}

message QueryRequest {
  string namespace = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message JoinGeneralRequest {
  string node = 1;
  string join = 2;
  infinimesh.node.access.v1.Level access = 3;
}

