syntax = "proto3";
package infinimesh.node.v1;
option go_package = "github.com/infinimesh/proto/node;node";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Infinimesh API";
    version: "1.0.0";
  };
};
import "node/accounts/accounts.proto";
import "node/access/access.proto";
import "node/sessions/sessions.proto";

message TokenRequest {
  infinimesh.node.accounts.v1.Credentials auth = 1;
  int64 exp = 2 [deprecated = true];
  optional string uuid = 3;
  optional bool inf = 4 [deprecated = true];
  optional string client = 5;
  int64 expires_at = 6;
  optional bool infinite = 7;
}

message TokenResponse {
  string token = 1;
}

message SetCredentialsRequest {
  string uuid = 1;
  infinimesh.node.accounts.v1.Credentials credentials = 2;
}

message GetCredentialsRequest {
  string uuid = 1;
}

message GetCredentialsResponse {
  repeated infinimesh.node.accounts.v1.Credentials credentials = 1;
}

message DeleteCredentialsRequest {
  string uuid = 1;
  string type = 2;
}

message SetCredentialsResponse {}
message DeleteResponse {}
message EmptyMessage {}

message ListRequest {
  int32 page_size = 1;
  string page_token = 2;
}

service AccountsService {
  rpc Token(TokenRequest) returns (TokenResponse) {
    option (google.api.http) = {
      post: "/v1/token"
      body: "*"
      additional_bindings {
        post: "/token"
        body: "*"
      }
    };
  };

  rpc Get(infinimesh.node.accounts.v1.Account) returns (infinimesh.node.accounts.v1.Account) {
    option (google.api.http) = {
      get: "/v1/accounts/{uuid}"
      additional_bindings {
        get: "/accounts/{uuid}"
      }
    };
  };
  rpc List(ListRequest) returns (infinimesh.node.accounts.v1.Accounts) {
    option (google.api.http) = {
      get: "/v1/accounts"
      additional_bindings {
        get: "/accounts"
      }
    };
  };

  rpc Create(infinimesh.node.accounts.v1.CreateRequest) returns (infinimesh.node.accounts.v1.CreateResponse) {
    option (google.api.http) = {
      post: "/v1/accounts"
      body: "*"
      additional_bindings {
        put: "/accounts"
        body: "*"
      }
    };
  };
  rpc Update(infinimesh.node.accounts.v1.Account) returns (infinimesh.node.accounts.v1.Account) {
    option (google.api.http) = {
      patch: "/v1/accounts/{uuid}"
      body: "*"
      additional_bindings {
        patch: "/accounts/{uuid}"
        body: "*"
      }
    };
  };
  rpc Toggle(infinimesh.node.accounts.v1.Account) returns (infinimesh.node.accounts.v1.Account) {
    option (google.api.http) = {
      post: "/v1/accounts/{uuid}/toggle"
      body: "*"
      additional_bindings {
        post: "/accounts/{uuid}/toggle"
        body: "*"
      }
    };
  };  

  rpc Delete(infinimesh.node.accounts.v1.Account) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/accounts/{uuid}"
      additional_bindings {
        delete: "/accounts/{uuid}"
      }
    };
  };
  rpc Deletables(infinimesh.node.accounts.v1.Account) returns (infinimesh.node.access.v1.Nodes) {
    option (google.api.http) = {
      get: "/v1/accounts/{uuid}/deletables"
      additional_bindings {
        get: "/accounts/{uuid}/deletables"
      }
    };
  };

  rpc SetCredentials(SetCredentialsRequest) returns (SetCredentialsResponse) {
    option (google.api.http) = {
      post: "/v1/accounts/{uuid}/credentials"
      body: "*"
      additional_bindings {
        post: "/accounts/{uuid}/credentials"
        body: "*"
      }
    };
  };

  rpc GetCredentials(GetCredentialsRequest) returns (GetCredentialsResponse) {
    option (google.api.http) = {
      get: "/v1/accounts/{uuid}/credentials"
      additional_bindings {
        get: "/accounts/{uuid}/credentials"
      }
    };
  };

  rpc DeleteCredentials(DeleteCredentialsRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/accounts/{uuid}/credentials/{type}"
      additional_bindings {
        delete: "/accounts/{uuid}/credentials/{type}"
      }
    };
  };
}

import "node/namespaces/namespaces.proto";

message JoinRequest {
  string namespace = 1;
  string account = 2;
  infinimesh.node.access.v1.Level access = 3;
}

service NamespacesService {
  rpc Get(infinimesh.node.namespaces.v1.Namespace) returns (infinimesh.node.namespaces.v1.Namespace) {
    option (google.api.http) = {
      get: "/v1/namespaces/{uuid}"
      additional_bindings {
        get: "/namespaces/{uuid}"
      }
    };
  };
  rpc List(ListRequest) returns (infinimesh.node.namespaces.v1.Namespaces) {
    option (google.api.http) = {
      get: "/v1/namespaces"
      additional_bindings {
        get: "/namespaces"
      }
    };
  };

  rpc Create(infinimesh.node.namespaces.v1.Namespace) returns (infinimesh.node.namespaces.v1.Namespace) {
    option (google.api.http) = {
      post: "/v1/namespaces"
      body: "*"
      additional_bindings {
        put: "/namespaces"
        body: "*"
      }
    };
  };
  rpc Update(infinimesh.node.namespaces.v1.Namespace) returns (infinimesh.node.namespaces.v1.Namespace) {
    option (google.api.http) = {
      patch: "/v1/namespaces/{uuid}"
      body: "*"
      additional_bindings {
        patch: "/namespaces/{uuid}"
        body: "*"
      }
    };
  };
  rpc Delete(infinimesh.node.namespaces.v1.Namespace) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/namespaces/{uuid}"
      additional_bindings {
        delete: "/namespaces/{uuid}"
      }
    };
  };
  rpc Deletables(infinimesh.node.namespaces.v1.Namespace) returns (infinimesh.node.access.v1.Nodes) {
    option (google.api.http) = {
      get: "/v1/namespaces/{uuid}/deletables"
      additional_bindings {
        get: "/namespaces/{uuid}/deletables"
      }
    };
  };

  // Accounts having access to this namespace
  rpc Joins(infinimesh.node.namespaces.v1.Namespace) returns (infinimesh.node.accounts.v1.Accounts) {
    option (google.api.http) = {
      get: "/v1/namespaces/{uuid}/joins"
      additional_bindings {
        get: "/namespaces/{uuid}/joins"
      }
    };
  }
  // Sets Access to this namespace for the given account(deletes if level is set to NONE(0))
  rpc Join(JoinRequest) returns (infinimesh.node.accounts.v1.Accounts) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/join"
      body: "*"
      additional_bindings {
        post: "/namespaces/{namespace}/join"
        body: "*"
      }
    };
  }
}

import "node/devices/devices.proto";

message DevicesTokenRequest {
  map<string, infinimesh.node.access.v1.Level> devices = 1;
  int64 exp = 2 [deprecated = true];
  bool post = 3;
  string namespace = 4;
  bool stream = 5;
  int64 expires_at = 6;
}

message RevokeDeviceTokenRequest {
  string id = 1;
  string token = 2;
}

message MoveRequest {
  string uuid = 1;
  string namespace = 2;
}

message QueryRequest {
  string namespace = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message JoinGeneralRequest {
  string node = 1;
  string join = 2;
  infinimesh.node.access.v1.Level access = 3;
}

service DevicesService {
  rpc Get(infinimesh.node.devices.v1.Device) returns (infinimesh.node.devices.v1.Device) {
    option (google.api.http) = {
      get: "/v1/devices/{uuid}"
      additional_bindings {
        get: "/devices/{uuid}"
      }
    };
  };
  rpc List(QueryRequest) returns (infinimesh.node.devices.v1.Devices) {
    option (google.api.http) = {
      get: "/v1/devices"
      additional_bindings {
        get: "/devices"
      }
    };
  };

  rpc Create(infinimesh.node.devices.v1.CreateRequest) returns (infinimesh.node.devices.v1.CreateResponse) {
    option (google.api.http) = {
      post: "/v1/devices"
      body: "*"
      additional_bindings {
        put: "/devices"
        body: "*"
      }
    };
  };
  rpc Update(infinimesh.node.devices.v1.Device) returns (infinimesh.node.devices.v1.Device) {
    option (google.api.http) = {
      patch: "/v1/devices/{uuid}"
      body: "*"
      additional_bindings {
        patch: "/devices/{uuid}"
        body: "*"
      }
    };
  };
  rpc Delete(infinimesh.node.devices.v1.Device) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/devices/{uuid}"
      additional_bindings {
        delete: "/devices/{uuid}"
      }
    };
  };

  rpc Toggle(infinimesh.node.devices.v1.Device) returns (infinimesh.node.devices.v1.Device) {
    option (google.api.http) = {
      post: "/v1/devices/{uuid}/toggle"
      body: "*"
      additional_bindings {
        post: "/devices/{uuid}/toggle"
        body: "*"
      }
    };
  };
  rpc ToggleBasic(infinimesh.node.devices.v1.Device) returns (infinimesh.node.devices.v1.Device) {
    option (google.api.http) = {
      post: "/v1/devices/{uuid}/toggle/basic"
      body: "*"
      additional_bindings {
        post: "/devices/{uuid}/toggle/basic"
        body: "*"
      }
    };
  };

  rpc MakeDevicesToken(DevicesTokenRequest) returns (TokenResponse) {
    option (google.api.http) = {
      post: "/v1/devices/token"
      body: "*"
      additional_bindings {
        post: "/devices/token"
        body: "*"
      }
    };
  };

  rpc GetByToken(infinimesh.node.devices.v1.Device) returns (infinimesh.node.devices.v1.Device);
  rpc GetByFingerprint(infinimesh.node.devices.v1.GetByFingerprintRequest) returns (infinimesh.node.devices.v1.Device);
  rpc RevokeDevicesToken(RevokeDeviceTokenRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      post: "/v1/devices/token/revoke"
      body: "*"
      additional_bindings {
        post: "/devices/token/revoke"
        body: "*"
      }
    };
  };
}

service SessionsService {
  rpc Get(ListRequest) returns (infinimesh.node.sessions.v1.Sessions) {
    option (google.api.http) = {
      get: "/v1/sessions"
      additional_bindings {
        get: "/sessions"
      }
    };
  };

  rpc GetActivity(EmptyMessage) returns (infinimesh.node.sessions.v1.Activity) {
    option (google.api.http) = {
      get: "/v1/sessions/activity"
      additional_bindings {
        get: "/sessions/activity"
      }
    };
  };

  rpc Revoke(infinimesh.node.sessions.v1.Session) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/sessions/{id}"
      additional_bindings {
        delete: "/sessions/{id}"
      }
    };
  };
}

import "shadow/shadow.proto";

service ShadowService {
  rpc Get(infinimesh.shadow.v1.GetRequest) returns (infinimesh.shadow.v1.GetResponse) {
    option (google.api.http) = {
      get: "/v1/devices/{device}/state"
      additional_bindings {
        get: "/devices/states"
      }
    };
  };
  rpc Patch(infinimesh.shadow.v1.Shadow) returns (infinimesh.shadow.v1.Shadow) {
    option (google.api.http) = {
      post: "/v1/devices/{device}/state"
      body: "*"
      additional_bindings {
        post: "/devices/states"
        body: "*"
      }
    };
  };
  rpc Remove(infinimesh.shadow.v1.RemoveRequest) returns (infinimesh.shadow.v1.Shadow) {
    option (google.api.http) = {
      post: "/v1/devices/{device}/state:remove"
      body: "*"
      additional_bindings {
        post: "/devices/states/remove"
        body: "*"
      }
    };
  };
  rpc StreamShadow(infinimesh.shadow.v1.StreamShadowRequest) returns (stream infinimesh.shadow.v1.Shadow) {
    option (google.api.http) = {
      get: "/v1/devices/states/stream"
      additional_bindings {
        get: "/devices/states/stream"
      }
    };
  }

  rpc StreamShadowSync(infinimesh.shadow.v1.StreamShadowRequest) returns (stream infinimesh.shadow.v1.Shadow);
}

message LDAPProviders {
  map<string, string> providers = 1; // map of keys to titles (titles can be empty)
}

service InternalService { // not revenue
  rpc GetLDAPProviders(EmptyMessage) returns (LDAPProviders) {
    option (google.api.http) = {
      get: "/v1/i/ldapp"
      additional_bindings {
        get: "/i/ldapp"
      }
    };
  }
}
