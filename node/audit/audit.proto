syntax = "proto3";
package infinimesh.node.audit.v1;
option go_package = "github.com/infinimesh/proto/node/audit;audit";

import "google/protobuf/timestamp.proto";
import "node/devices/devices.proto";
import "shadow/shadow.proto";

// AuditRecord is one audit log row. action is read, create, token, ota_assign, alarm_ack, or alarm_clear.
// The collection is append-only.
message AuditRecord {
  string id = 1;
  string account = 2;
  string device = 3;
  // jti of the token that performed the read, when the token has one.
  string token_id = 4;
  google.protobuf.Timestamp at = 5;
  string action = 6;
  string namespace = 7;
}

message AuditRecords {
  repeated AuditRecord records = 1;
  string next_page_token = 2;
}

message ListAuditRequest {
  string device = 1;
  string account = 2;
  int32 page_size = 3;
  string page_token = 4;
  string namespace = 5;
}

message ExportRequest {
  string device = 1;
}

// ExportResponse is the device registry entry, the current shadow, and references to stored history.
message ExportResponse {
  infinimesh.node.devices.v1.Device device = 1;
  infinimesh.shadow.v1.Shadow shadow = 2;
  repeated string history = 3;
}
