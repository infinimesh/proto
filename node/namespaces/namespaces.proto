syntax = "proto3";
package infinimesh.node.namespaces.v1;
option go_package = "github.com/infinimesh/proto/node/namespaces;namespaces";

import "node/access/access.proto";
import "google/protobuf/struct.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

message Namespace {
  string uuid = 1;
  string title = 2;
  optional infinimesh.node.access.v1.Access access = 3;
  optional string plugin = 4;
  google.protobuf.Struct config = 5;
  OTAConfig ota = 6;
  Quota quota = 7;
}

// OTAConfig names who may write desired.ota.
// enabled can be set only when an OTA addon is registered: a plugin of kind OTA
// that is public, or whose namespace is this namespace.
// provider is none, hawkbit, mender, or webhook. Empty is none.
// webhook_url is required when provider is webhook.
// backend_url and backend are ignored.
// addon_registered is set on read and ignored on write.
message OTAConfig {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    example: "{\"enabled\":true,\"provider\":\"webhook\",\"webhookUrl\":\"https://ota.example/hook\"}"
  };
  bool enabled = 1;
  string backend_url = 2 [deprecated = true];
  string backend = 3 [deprecated = true];
  string provider = 4;
  string webhook_url = 5;
  bool addon_registered = 6;
}

// Quota limits a namespace. Zero means no limit.
message Quota {
  int32 max_devices = 1;
  double device_messages_per_second = 2;
  double namespace_messages_per_second = 3;
}

message Namespaces {
  repeated Namespace namespaces = 1;
  string next_page_token = 2;
}
