syntax = "proto3";
package infinimesh.plugins.v1;
option go_package = "github.com/infinimesh/proto/plugins;plugins";

import "google/api/annotations.proto";
import "node/access/access.proto";

enum PluginKind {
    UNKNOWN = 0;
    EMBEDDED = 1; // Plugin will be embedded into Console as Page
}

message Plugin {
    string uuid = 1;
    string logo = 2; // Plugin logo url in format supported by <img> tag
    string title = 3;
    string description = 4;
    bool public = 5;
    
    optional string namespace = 6; // Required to get not-public Plugin
    optional infinimesh.node.access.v1.Access access = 7;
    
    PluginKind kind = 8;
    optional EmbededPluginConf embedded_conf = 9;
}

message Plugins {
    repeated Plugin pool = 1 [deprecated = true];
    string next_page_token = 2;
    repeated Plugin plugins = 3;
}

message EmbededPluginConf {
    string frame_url = 1;
}

message ListRequest {
    optional string namespace = 1;
    int32 page_size = 2;
    string page_token = 3;
}

service PluginsService {
    rpc Get(Plugin) returns (Plugin){
        option (google.api.http) = {
      get: "/v1/plugins/{uuid}"
      additional_bindings {
        get: "/plugins/{uuid}"
      }
    };
    };
    rpc List(ListRequest) returns (Plugins) {
        option (google.api.http) = {
      get: "/v1/plugins"
      additional_bindings {
        get: "/plugins"
      }
    };
    };
    rpc Create(Plugin) returns (Plugin) {
        option (google.api.http) = {
      post: "/v1/plugins"
      body: "*"
      additional_bindings {
        put: "/plugins"
        body: "*"
      }
    };
    };
    rpc Update(Plugin) returns (Plugin) {
        option (google.api.http) = {
      post: "/v1/plugins/{uuid}"
      body: "*"
      additional_bindings {
        post: "/plugins/{uuid}"
        body: "*"
      }
    };
    };
    rpc Delete(Plugin) returns (Plugin) {
        option (google.api.http) = {
      delete: "/v1/plugins/{uuid}"
      additional_bindings {
        delete: "/plugins/{uuid}"
      }
    };
    };
}