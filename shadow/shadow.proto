syntax = "proto3";

package infinimesh.shadow;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";


message State {
  google.protobuf.Timestamp timestamp = 1;
  google.protobuf.Struct data = 2;
}

message ConnectionState {
  bool connected = 1;
  google.protobuf.Timestamp timestamp = 2;
  string client_id = 3;
}

enum ShadowEvent {
  STATE = 0;
  DEVICE_ADDED = 1;
  DEVICE_REMOVED = 2;
}

message DeviceMeta {
  string device = 1;
  string title = 2;
  string namespace = 3;
  repeated string tags = 4;
}

message Shadow {
  string device = 1;
  State reported = 2;
  State desired = 3;
  ConnectionState connection = 4;
  uint64 event_id = 5;
  string title = 6;
  string namespace = 7;
  repeated string tags = 8;
  ShadowEvent event = 9;
  string account = 10;
}

message GetRequest {
  repeated string pool = 1;
}

message GetResponse {
  repeated Shadow shadows = 1;
}

enum StateKey {
  REPORTED = 0;
  DESIRED = 1;
  CONNECTION = 2;
}

message RemoveRequest {
  string device = 1;
  StateKey state_key = 2;
  string key = 3;
}

message StreamShadowRequest {
  repeated string devices = 1;
  bool only_delta = 2;
  bool sync = 3;
  string namespace = 4;
  repeated string namespaces = 5;
  string account = 6;
  repeated DeviceMeta catalog = 7;
  repeated StateKey include = 8;
}

service ShadowService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Patch(Shadow) returns (Shadow);
  rpc Remove(RemoveRequest) returns (Shadow);
  rpc StreamShadow(StreamShadowRequest)
      returns (stream Shadow);
  rpc StreamShadowSync(StreamShadowRequest)
      returns (stream Shadow);
  rpc PublishDeviceScope(Shadow) returns (google.protobuf.Empty);
}
