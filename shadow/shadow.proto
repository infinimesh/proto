syntax = "proto3";

package infinimesh.shadow.v1;
option go_package = "github.com/infinimesh/proto/shadow;shadow";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";


// State is one section of a device shadow.
// data.ota, when set, is the over-the-air document:
// version (string), url (string), sha256 (string).
// Reported state also carries state (string), progress (number), and error (string).
message State {
  google.protobuf.Timestamp timestamp = 1;
  google.protobuf.Struct data = 2;
  uint64 version = 3;
}

message ConnectionState {
  bool connected = 1;
  google.protobuf.Timestamp timestamp = 2;
  string client_id = 3;
}

enum ShadowEvent {
  STATE = 0;
  DEVICE_ADDED = 1;
  DEVICE_REMOVED = 2;
  // A tag was added. tag names it. tags is the full list after the change.
  TAG_ADDED = 3;
  // A tag was removed. tag names it. tags is the full list after the change.
  TAG_REMOVED = 4;
}

message DeviceMeta {
  string device = 1;
  string title = 2;
  string namespace = 3;
  repeated string tags = 4;
}

message Shadow {
  string device = 1;
  State reported = 2;
  State desired = 3;
  ConnectionState connection = 4;
  uint64 event_id = 5;
  string title = 6;
  string namespace = 7;
  repeated string tags = 8;
  ShadowEvent event = 9;
  string account = 10;
  uint64 sequence = 11;
  // Tag that was added or removed when event is TAG_ADDED or TAG_REMOVED.
  string tag = 12;
}

message PatchManyRequest {
  repeated string devices = 1;
  // Applied as desired state on every device.
  State desired = 2;
  // Resolved by the API to devices before the shadow process sees the call.
  string namespace = 3;
  string tag = 4;
}

message PatchManyResponse {
  int32 updated = 1;
}

message GetRequest {
  repeated string pool = 1 [deprecated = true];
  repeated string devices = 2;
  string device = 3;
}

message GetResponse {
  repeated Shadow shadows = 1;
}

enum StateKey {
  REPORTED = 0;
  DESIRED = 1;
  CONNECTION = 2;
}

message RemoveRequest {
  string device = 1;
  StateKey state_key = 2;
  string key = 3;
}

message StreamShadowRequest {
  repeated string devices = 1;
  // When true, each state message is the published change. When false, the stored shadow is sent with that change merged in.
  bool only_delta = 2;
  bool sync = 3;
  // Stream every device in this namespace that the account can read. Requires an account token.
  string namespace = 4;
  // Namespaces watched by an account stream. Set by the API, not the client.
  repeated string namespaces = 5;
  // Authenticated account for a scope stream. Set by the API, not the client.
  string account = 6;
  repeated DeviceMeta catalog = 7;
  // State sections to send: REPORTED, DESIRED, CONNECTION. Empty sends all three. Membership events are unchanged.
  repeated StateKey include = 8;
  uint64 resume_after = 9;
}

service ShadowService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Patch(Shadow) returns (Shadow);
  rpc Remove(RemoveRequest) returns (Shadow);
  rpc StreamShadow(StreamShadowRequest)
      returns (stream Shadow);
  rpc StreamShadowSync(StreamShadowRequest)
      returns (stream Shadow);
  rpc PublishDeviceScope(Shadow) returns (google.protobuf.Empty);
  rpc PatchMany(PatchManyRequest) returns (PatchManyResponse);
}
