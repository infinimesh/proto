version: v1
managed:
  enabled: false
plugins:
  - name: go
    out: .
    opt: paths=source_relative
  - name: go-grpc
    out: .
    opt: 
      - paths=source_relative
  - name: connect-go
    out: .
    opt:
      - paths=source_relative
  - name: grpc-gateway
    out: .
    opt: paths=source_relative
  - name: openapiv2
    out: .
    strategy: all
    opt: allow_merge=true,merge_file_name=api
